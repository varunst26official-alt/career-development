<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack Code Arena — LeetCode for Enterprise React & Mendix Developers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Canvas Confetti for Solved Celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-sky: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --editor-bg: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #090d16;
      font-size: 1.1rem;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 0.725rem;
      color: var(--text-muted);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stat-pill {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.775rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-share {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-sky);
      font-size: 0.775rem;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-share:hover { background: var(--accent-sky); color: #090d16; }

    /* Main Split-Screen Workspace */
    .arena-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 61px);
      overflow: hidden;
    }

    /* Left Sidebar: Problem Catalog & Descriptions */
    .left-pane {
      width: 45%;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      background: #0d1322;
      overflow-y: auto;
    }

    .problem-selector-bar {
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    select.problem-dropdown {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      flex: 1;
      cursor: pointer;
      outline: none;
    }

    .problem-content {
      padding: 1.5rem;
      flex: 1;
    }

    .problem-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .difficulty-tag {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      text-transform: uppercase;
    }
    .tag-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .tag-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-hard { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    .category-tag {
      font-size: 0.725rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .problem-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: #fff;
    }

    .mendix-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }
    .mendix-box h4 {
      font-size: 0.8rem;
      color: #a5b4fc;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .mendix-box p {
      font-size: 0.825rem;
      color: #c7d2fe;
      line-height: 1.5;
    }

    .problem-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 800;
      margin: 1.25rem 0 0.5rem;
    }

    .examples-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      margin-bottom: 1rem;
      color: #94a3b8;
    }
    .examples-box strong { color: #f1f5f9; }

    /* Right Pane: Interactive Code Editor & Test Console */
    .right-pane {
      width: 55%;
      display: flex;
      flex-direction: column;
      background: var(--editor-bg);
    }

    .editor-toolbar {
      padding: 0.5rem 1rem;
      background: #080d1a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-tab {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent-sky);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .action-btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-run {
      background: #10b981;
      color: #090d16;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .btn-run:hover { background: #34d399; }

    .btn-reset {
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-reset:hover { background: #334155; color: #fff; }

    .code-area-container {
      flex: 1;
      position: relative;
    }

    textarea#codeEditor {
      width: 100%;
      height: 100%;
      background: transparent;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      padding: 1rem 1.25rem;
      border: none;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    /* Bottom Test Output Panel */
    .test-panel {
      height: 38%;
      background: #080d1a;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
    }

    .test-panel-header {
      padding: 0.5rem 1rem;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .test-results-list {
      padding: 0.85rem 1rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .test-item {
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .test-item.passed { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .test-item.failed { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

    /* Custom Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #090d16;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (max-width: 900px) {
      .arena-container { flex-direction: column; height: auto; overflow: visible; }
      .left-pane, .right-pane { width: 100%; height: auto; }
      textarea#codeEditor { height: 350px; }
      .test-panel { height: 260px; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">⚔️</div>
      <div class="brand-title">
        <h1>Full-Stack Code Arena</h1>
        <p>LeetCode for Enterprise React & Mendix Architects</p>
      </div>
    </div>

    <div class="header-stats">
      <div class="stat-pill">
        <span>🏆 Solved:</span>
        <strong id="solvedCountLabel" style="color: var(--accent-emerald);">0 / 8</strong>
      </div>
      <div class="stat-pill">
        <span>⚡ XP Score:</span>
        <strong id="xpScoreLabel" style="color: var(--accent-amber);">0 XP</strong>
      </div>
      <button class="btn-share" onclick="sharePlatform()">🔗 Share with Friends</button>
      <a href="index.html" class="btn-share" style="text-decoration: none; display: flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.06); color: #cbd5e1; border-color: var(--card-border);">📊 Hub</a>
    </div>
  </header>

  <!-- Main Split-Screen Workspace -->
  <div class="arena-container">
    
    <!-- Left Pane: Problem Statement & Mendix Bridge -->
    <div class="left-pane">
      <div class="problem-selector-bar">
        <label for="problemSelect" style="font-size: 0.775rem; color: var(--text-muted); font-weight: 700;">CHALLENGE:</label>
        <select id="problemSelect" class="problem-dropdown" onchange="loadProblem(this.value)">
          <!-- Options populated by JS -->
        </select>
      </div>

      <div class="problem-content" id="problemContent">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Right Pane: Code Editor & Test Console -->
    <div class="right-pane">
      <div class="editor-toolbar">
        <div class="editor-tab">
          <span>⚡ solution.ts</span>
        </div>
        <div class="action-btn-group">
          <button class="btn-reset" onclick="resetCurrentCode()">↺ Reset</button>
          <button class="btn-run" onclick="runTests()">▶ Run Tests</button>
        </div>
      </div>

      <div class="code-area-container">
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>

      <!-- Test Output Console -->
      <div class="test-panel">
        <div class="test-panel-header">
          <span>Test Suite Results</span>
          <span id="testSummaryBadge" style="color: #94a3b8;">Click "Run Tests"</span>
        </div>
        <div class="test-results-list" id="testResultsList">
          <div style="color: #64748b; font-style: italic; text-align: center; margin-top: 2rem;">
            Ready to test. Review the problem on the left, edit your function, and click ▶ Run Tests.
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast-msg"></div>

  <script>
    // =========================================================================
    // 8 PROGRESSIVE ENTERPRISE CHALLENGES (Mendix ➔ React)
    // =========================================================================
    const CHALLENGES = [
      {
        id: "p1",
        title: "1. The Closure-Safe Counter",
        category: "Phase 1: Hooks & Memory",
        difficulty: "Easy",
        xp: 100,
        mendixParallel: "In a Mendix Microflow loop or background task, if you increment an account balance using a stale variable instead of refreshing the latest object from database cache, you overwrite data. In React, functional updates (prev => prev + 1) bypass frozen closures.",
        description: "Write a function <code>createCounter(initialValue)</code> that returns an object with three methods: <code>increment()</code>, <code>decrement()</code>, and <code>getValue()</code>. The methods must compute updates sequentially without relying on stale closure snapshots.",
        example: "const counter = createCounter(10);\ncounter.increment(); // 11\ncounter.increment(); // 12\ncounter.decrement(); // 11\ncounter.getValue();  // 11",
        starterCode: `// Fix and complete the closure-safe counter
function createCounter(initialValue = 0) {
  let val = initialValue;

  return {
    increment: () => {
      // TODO: increment value
      return ++val;
    },
    decrement: () => {
      // TODO: decrement value
      return --val;
    },
    getValue: () => {
      // TODO: return current value
      return val;
    }
  };
}`,
        tests: [
          {
            name: "Initializes with given starting value",
            run: (code) => {
              const fn = new Function(code + "; return createCounter(25000);")();
              return fn.getValue() === 25000;
            }
          },
          {
            name: "Increments sequentially without stale loss",
            run: (code) => {
              const fn = new Function(code + "; return createCounter(100);")();
              fn.increment();
              fn.increment();
              fn.increment();
              return fn.getValue() === 103;
            }
          },
          {
            name: "Decrements properly",
            run: (code) => {
              const fn = new Function(code + "; return createCounter(50);")();
              fn.decrement();
              fn.decrement();
              return fn.getValue() === 48;
            }
          }
        ]
      },

      {
        id: "p2",
        title: "2. The Debounce Search Function",
        category: "Phase 1: Performance & Timers",
        difficulty: "Medium",
        xp: 150,
        mendixParallel: "In Mendix, executing an On-Change microflow on every keystroke in a 10,000-row Data Grid causes massive server queue spikes. Debounce pauses execution until the user stops typing for 'delay' milliseconds.",
        description: "Implement a function <code>debounce(fn, delay)</code>. When the returned function is called repeatedly within the delay window, the timer resets, and <code>fn</code> is only executed ONCE after the user stops calling it.",
        example: "const search = debounce((q) => fetchResults(q), 300);\nsearch('G');\nsearch('Gr'); // Cancels 'G' timer\nsearch('Gro'); // Only 'Gro' executes after 300ms",
        starterCode: `function debounce(fn, delay) {
  let timerId = null;

  return function(...args) {
    // TODO: Clear existing timer if called again before delay
    if (timerId) {
      clearTimeout(timerId);
    }

    // TODO: Launch new timer that executes fn
    timerId = setTimeout(() => {
      fn(...args);
    }, delay);
  };
}`,
        tests: [
          {
            name: "Returns a callable function",
            run: (code) => {
              const fn = new Function(code + "; return debounce(() => {}, 100);")();
              return typeof fn === 'function';
            }
          },
          {
            name: "Only calls the target function once after rapid calls",
            run: async (code) => {
              return new Promise((resolve) => {
                let callCount = 0;
                let lastArg = "";
                const makeDebounce = new Function(code + "; return debounce;")();
                const debounced = makeDebounce((val) => {
                  callCount++;
                  lastArg = val;
                }, 50);

                debounced("apple");
                debounced("banana");
                debounced("cherry");

                setTimeout(() => {
                  resolve(callCount === 1 && lastArg === "cherry");
                }, 120);
              });
            }
          }
        ]
      },

      {
        id: "p3",
        title: "3. Pure Derived State Calculator",
        category: "Phase 1: State Hygiene",
        difficulty: "Easy",
        xp: 100,
        mendixParallel: "In Mendix, you never create a stored database column for NetWorth. You make it a Calculated Attribute: $Account/Assets - $Account/Debts. In React, derived state must be calculated on-the-fly without redundant useState.",
        description: "Write a function <code>computePortfolioMetrics(holdings, debts)</code> that calculates <code>grossAssets</code>, <code>totalDebt</code>, <code>netWorth</code>, and a boolean <code>isSolvent</code> (true if netWorth >= 0).",
        example: "computePortfolioMetrics([{ amount: 50000 }, { amount: 20000 }], [{ amount: 15000 }]);\n// Returns: { grossAssets: 70000, totalDebt: 15000, netWorth: 55000, isSolvent: true }",
        starterCode: `function computePortfolioMetrics(holdings, debts) {
  // TODO: Sum holdings amounts
  const grossAssets = holdings.reduce((sum, h) => sum + h.amount, 0);

  // TODO: Sum debts amounts
  const totalDebt = debts.reduce((sum, d) => sum + d.amount, 0);

  // TODO: Calculate netWorth & solvency
  const netWorth = grossAssets - totalDebt;
  const isSolvent = netWorth >= 0;

  return { grossAssets, totalDebt, netWorth, isSolvent };
}`,
        tests: [
          {
            name: "Correctly sums gross assets and total debts",
            run: (code) => {
              const fn = new Function(code + "; return computePortfolioMetrics;")();
              const res = fn([{ amount: 100 }, { amount: 200 }], [{ amount: 50 }]);
              return res.grossAssets === 300 && res.totalDebt === 50 && res.netWorth === 250 && res.isSolvent === true;
            }
          },
          {
            name: "Correctly flags isSolvent as false when debt exceeds assets",
            run: (code) => {
              const fn = new Function(code + "; return computePortfolioMetrics;")();
              const res = fn([{ amount: 500 }], [{ amount: 800 }]);
              return res.netWorth === -300 && res.isSolvent === false;
            }
          }
        ]
      },

      {
        id: "p4",
        title: "4. Immutable List Item Deletion",
        category: "Phase 1: Array Immutability",
        difficulty: "Easy",
        xp: 100,
        mendixParallel: "In Mendix, you execute a Delete Object activity. In React, state arrays are immutable in RAM. Calling .splice() mutates the existing memory address and React refuses to re-render. You must use .filter() to create a fresh reference.",
        description: "Write a function <code>deleteTransaction(list, idToDelete)</code> that returns a NEW array with the item removed, ensuring the original array was NOT mutated.",
        example: "const original = [{ id: '1' }, { id: '2' }];\nconst updated = deleteTransaction(original, '1');\n// updated: [{ id: '2' }]\n// original is unchanged!",
        starterCode: `function deleteTransaction(list, idToDelete) {
  // TODO: Return a fresh array using .filter() without mutating original list
  return list.filter(item => item.id !== idToDelete);
}`,
        tests: [
          {
            name: "Removes matching item correctly",
            run: (code) => {
              const fn = new Function(code + "; return deleteTransaction;")();
              const original = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
              const res = fn(original, 'b');
              return res.length === 2 && res[0].id === 'a' && res[1].id === 'c';
            }
          },
          {
            name: "Does not mutate the original input array (Strict Immutability)",
            run: (code) => {
              const fn = new Function(code + "; return deleteTransaction;")();
              const original = Object.freeze([{ id: 'a' }, { id: 'b' }]);
              const res = fn(original, 'a');
              return res !== original && original.length === 2;
            }
          }
        ]
      },

      {
        id: "p5",
        title: "5. The Toggle State Machine",
        category: "Phase 2: Custom Hooks Logic",
        difficulty: "Medium",
        xp: 150,
        mendixParallel: "In Mendix, toggling a boolean attribute on a helper NPE requires an Exclusive Split ($Helper/IsOpen = true -> false else true). In React, an enterprise toggle helper can flip booleans or explicitly set true/false.",
        description: "Write a function <code>createToggle(initialValue)</code> that returns <code>{ value, toggle }</code>. Calling <code>toggle()</code> flips the boolean. Calling <code>toggle(true)</code> forces it to true; calling <code>toggle(false)</code> forces it to false.",
        example: "const t = createToggle(false);\nt.toggle(); // true\nt.toggle(); // false\nt.toggle(true); // true\nt.toggle(true); // still true",
        starterCode: `function createToggle(initialValue = false) {
  let state = !!initialValue;

  return {
    get: () => state,
    toggle: (explicitValue) => {
      if (typeof explicitValue === 'boolean') {
        state = explicitValue;
      } else {
        state = !state;
      }
      return state;
    }
  };
}`,
        tests: [
          {
            name: "Initializes with provided boolean",
            run: (code) => {
              const fn = new Function(code + "; return createToggle(true);")();
              return fn.get() === true;
            }
          },
          {
            name: "Toggles automatically on empty call",
            run: (code) => {
              const fn = new Function(code + "; return createToggle(false);")();
              fn.toggle();
              const afterFirst = fn.get();
              fn.toggle();
              const afterSecond = fn.get();
              return afterFirst === true && afterSecond === false;
            }
          },
          {
            name: "Respects explicit boolean override parameter",
            run: (code) => {
              const fn = new Function(code + "; return createToggle(false);")();
              fn.toggle(true);
              const test1 = fn.get() === true;
              fn.toggle(true);
              const test2 = fn.get() === true;
              fn.toggle(false);
              const test3 = fn.get() === false;
              return test1 && test2 && test3;
            }
          }
        ]
      },

      {
        id: "p6",
        title: "6. Deep Object Cloner (No JSON Hacks)",
        category: "Phase 2: Deep Immutability",
        difficulty: "Hard",
        xp: 200,
        mendixParallel: "In Mendix, cloning an entity and all its child associations requires deep copy logic. In React, JSON.parse(JSON.stringify(x)) loses functions, dates, and breaks on circular references. Senior architects implement recursive cloning.",
        description: "Implement <code>deepClone(obj)</code> that returns a complete deep clone of nested objects and arrays without mutating the source references.",
        example: "const a = { user: { balance: 100 }, tags: ['fintech'] };\nconst b = deepClone(a);\nb.user.balance = 500;\n// a.user.balance is STILL 100!",
        starterCode: `function deepClone(target) {
  if (target === null || typeof target !== 'object') {
    return target;
  }

  if (Array.isArray(target)) {
    return target.map(item => deepClone(item));
  }

  const copy = {};
  for (const key in target) {
    if (Object.prototype.hasOwnProperty.call(target, key)) {
      copy[key] = deepClone(target[key]);
    }
  }
  return copy;
}`,
        tests: [
          {
            name: "Clones primitive values directly",
            run: (code) => {
              const fn = new Function(code + "; return deepClone;")();
              return fn(42) === 42 && fn("hello") === "hello";
            }
          },
          {
            name: "Ensures nested object references are completely decoupled",
            run: (code) => {
              const fn = new Function(code + "; return deepClone;")();
              const source = { account: { balance: 50000, ledger: [100, 200] } };
              const clone = fn(source);
              clone.account.balance = 99999;
              clone.account.ledger.push(300);
              return source.account.balance === 50000 && source.account.ledger.length === 2;
            }
          }
        ]
      },

      {
        id: "p7",
        title: "7. Async Retry with Exponential Backoff",
        category: "Phase 2: Resilient API Calling",
        difficulty: "Hard",
        xp: 250,
        mendixParallel: "In Mendix, when a Call REST Service action fails due to network jitter, you build a custom error-handler loop. In TanStack Query / React, auto-retries with exponential delay prevent server hammering.",
        description: "Write <code>retryOperation(asyncFn, maxRetries)</code>. It executes <code>asyncFn()</code>. If it rejects, it retries up to <code>maxRetries</code> times before throwing the final error.",
        example: "await retryOperation(() => fetchPrices(), 3);",
        starterCode: `async function retryOperation(asyncFn, maxRetries = 3) {
  let attempts = 0;

  while (attempts < maxRetries) {
    try {
      return await asyncFn();
    } catch (err) {
      attempts++;
      if (attempts >= maxRetries) {
        throw err;
      }
    }
  }
}`,
        tests: [
          {
            name: "Returns immediately on first success",
            run: async (code) => {
              const fn = new Function(code + "; return retryOperation;")();
              let count = 0;
              const res = await fn(async () => {
                count++;
                return "SUCCESS";
              }, 3);
              return res === "SUCCESS" && count === 1;
            }
          },
          {
            name: "Retries and succeeds on the 3rd attempt",
            run: async (code) => {
              const fn = new Function(code + "; return retryOperation;")();
              let count = 0;
              const res = await fn(async () => {
                count++;
                if (count < 3) throw new Error("Network blip");
                return "RECOVERED";
              }, 4);
              return res === "RECOVERED" && count === 3;
            }
          }
        ]
      },

      {
        id: "p8",
        title: "8. Zustand Mini-Store Implementation",
        category: "Phase 2: Global State Engine",
        difficulty: "Medium",
        xp: 200,
        mendixParallel: "Zustand is the React equivalent of a Mendix Session Entity. It holds state in memory outside any page and allows any component to subscribe to changes using listeners.",
        description: "Implement <code>createStore(initialState)</code> with three methods: <code>getState()</code>, <code>setState(updater)</code>, and <code>subscribe(listener)</code>.",
        example: "const store = createStore({ count: 0 });\nstore.subscribe((state) => console.log(state));\nstore.setState({ count: 1 });",
        starterCode: `function createStore(initialState) {
  let state = initialState;
  const listeners = new Set();

  return {
    getState: () => state,
    setState: (update) => {
      const nextState = typeof update === 'function' ? update(state) : update;
      state = { ...state, ...nextState };
      listeners.forEach(listener => listener(state));
    },
    subscribe: (listener) => {
      listeners.add(listener);
      return () => listeners.delete(listener); // Unsubscribe cleanup!
    }
  };
}`,
        tests: [
          {
            name: "Stores and returns initial state",
            run: (code) => {
              const fn = new Function(code + "; return createStore({ balance: 25000 });")();
              return fn.getState().balance === 25000;
            }
          },
          {
            name: "Notifies subscribers whenever state changes",
            run: (code) => {
              const fn = new Function(code + "; return createStore({ count: 0 });")();
              let receivedVal = 0;
              fn.subscribe((state) => {
                receivedVal = state.count;
              });
              fn.setState({ count: 42 });
              return receivedVal === 42;
            }
          },
          {
            name: "Unsubscribe stops notifying the listener",
            run: (code) => {
              const fn = new Function(code + "; return createStore({ count: 0 });")();
              let callCount = 0;
              const unsubscribe = fn.subscribe(() => { callCount++; });
              fn.setState({ count: 1 });
              unsubscribe();
              fn.setState({ count: 2 });
              return callCount === 1;
            }
          }
        ]
      }
    ];

    // =========================================================================
    // STATE & APP ENGINE
    // =========================================================================
    const STORAGE_KEY_CODE = 'arena_user_codes_v1';
    const STORAGE_KEY_SOLVED = 'arena_solved_problems_v1';

    let currentProblemId = CHALLENGES[0].id;
    let savedCodes = JSON.parse(localStorage.getItem(STORAGE_KEY_CODE) || '{}');
    let solvedSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY_SOLVED) || '[]'));

    // Populate Dropdown
    const selectElem = document.getElementById('problemSelect');
    CHALLENGES.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${solvedSet.has(p.id) ? '✅ ' : ''}${p.title} (${p.difficulty})`;
      selectElem.appendChild(opt);
    });

    // Load Problem
    function loadProblem(id) {
      currentProblemId = id;
      selectElem.value = id;
      const p = CHALLENGES.find(c => c.id === id);

      // Render Left Pane
      document.getElementById('problemContent').innerHTML = `
        <div class="problem-header">
          <span class="difficulty-tag tag-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
          <span class="category-tag">${p.category}</span>
          <span style="margin-left: auto; font-size: 0.775rem; color: #f59e0b; font-weight: 700;">+${p.xp} XP</span>
        </div>

        <h2 class="problem-title">${p.title}</h2>

        <div class="mendix-box">
          <h4>🏛️ MENDIX ROSETTA STONE PARALLEL</h4>
          <p>${p.mendixParallel}</p>
        </div>

        <div class="section-title">PROBLEM SPECIFICATION</div>
        <div class="problem-desc">${p.description}</div>

        <div class="section-title">EXAMPLE USAGE</div>
        <pre class="examples-box"><code>${p.example}</code></pre>
      `;

      // Set Editor Code
      const editor = document.getElementById('codeEditor');
      editor.value = savedCodes[id] || p.starterCode;

      // Reset Output Console
      document.getElementById('testSummaryBadge').innerText = 'Ready to Run';
      document.getElementById('testSummaryBadge').style.color = '#94a3b8';
      document.getElementById('testResultsList').innerHTML = `
        <div style="color: #64748b; font-style: italic; text-align: center; margin-top: 2rem;">
          Click "▶ Run Tests" to test your implementation.
        </div>
      `;
    }

    // Auto-indent support in textarea
    const editorElem = document.getElementById('codeEditor');
    editorElem.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 2;
      }
    });

    // Save code on keystroke
    editorElem.addEventListener('input', () => {
      savedCodes[currentProblemId] = editorElem.value;
      localStorage.setItem(STORAGE_KEY_CODE, JSON.stringify(savedCodes));
    });

    function resetCurrentCode() {
      const p = CHALLENGES.find(c => c.id === currentProblemId);
      editorElem.value = p.starterCode;
      savedCodes[currentProblemId] = p.starterCode;
      localStorage.setItem(STORAGE_KEY_CODE, JSON.stringify(savedCodes));
    }

    // Run Automated Test Suite
    async function runTests() {
      const p = CHALLENGES.find(c => c.id === currentProblemId);
      const code = editorElem.value;
      const listContainer = document.getElementById('testResultsList');
      listContainer.innerHTML = '';

      let passedCount = 0;
      document.getElementById('testSummaryBadge').innerText = 'Running tests...';
      document.getElementById('testSummaryBadge').style.color = '#38bdf8';

      for (let i = 0; i < p.tests.length; i++) {
        const t = p.tests[i];
        let passed = false;
        let errorMsg = null;

        try {
          passed = await t.run(code);
        } catch (err) {
          passed = false;
          errorMsg = err.message || String(err);
        }

        const div = document.createElement('div');
        div.className = `test-item ${passed ? 'passed' : 'failed'}`;
        div.innerHTML = `
          <span>${passed ? '✔' : '✖'} Test ${i + 1}: ${t.name}</span>
          <span>${passed ? 'PASSED' : (errorMsg ? 'ERROR' : 'FAILED')}</span>
        `;
        listContainer.appendChild(div);

        if (passed) passedCount++;
      }

      if (passedCount === p.tests.length) {
        document.getElementById('testSummaryBadge').innerText = `ALL ${passedCount}/${p.tests.length} TESTS PASSED! 🎉`;
        document.getElementById('testSummaryBadge').style.color = '#34d399';

        // Mark Solved
        if (!solvedSet.has(p.id)) {
          solvedSet.add(p.id);
          localStorage.setItem(STORAGE_KEY_SOLVED, JSON.stringify(Array.from(solvedSet)));
          updateStats();
          updateDropdown();

          // Confetti celebration!
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });

          showToast(`🏆 Challenge Solved! +${p.xp} XP added.`);
        }
      } else {
        document.getElementById('testSummaryBadge').innerText = `${passedCount}/${p.tests.length} Tests Passed`;
        document.getElementById('testSummaryBadge').style.color = '#fb7185';
      }
    }

    function updateStats() {
      document.getElementById('solvedCountLabel').innerText = `${solvedSet.size} / ${CHALLENGES.length}`;
      let totalXp = 0;
      CHALLENGES.forEach(c => {
        if (solvedSet.has(c.id)) totalXp += c.xp;
      });
      document.getElementById('xpScoreLabel').innerText = `${totalXp} XP`;
    }

    function updateDropdown() {
      Array.from(selectElem.options).forEach(opt => {
        const id = opt.value;
        const p = CHALLENGES.find(c => c.id === id);
        opt.textContent = `${solvedSet.has(id) ? '✅ ' : ''}${p.title} (${p.difficulty})`;
      });
    }

    function sharePlatform() {
      navigator.clipboard.writeText(window.location.href);
      showToast("🔗 Link copied to clipboard! Share it with your friends.");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Initial load
    updateStats();
    loadProblem(currentProblemId);
  </script>
</body>
</html>
