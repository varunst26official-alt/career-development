<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack Code Arena — Enterprise React & Mendix LeetCode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-border: #1f293d;
      --text-main: #f9fafb;
      --text-muted: #94a3b8;
      --accent-emerald: #10b981;
      --accent-cyan: #06b6d4;
      --accent-sky: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --editor-bg: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-emerald));
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #090d16;
      font-size: 1.1rem;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-title p {
      font-size: 0.725rem;
      color: var(--text-muted);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .stat-pill {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.775rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-action {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent-sky);
      font-size: 0.775rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-action:hover { background: var(--accent-sky); color: #090d16; }

    /* Main Split-Screen Workspace */
    .arena-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      overflow: hidden;
    }

    /* Left Sidebar: Problem Catalog Drawer */
    .catalog-sidebar {
      width: 310px;
      background: #0b101d;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.2rem;
      background: #080d18;
      padding: 0.2rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .filter-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }
    .filter-tab.active {
      background: #1e293b;
      color: #fff;
    }

    .problem-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .problem-item {
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .problem-item:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .problem-item.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .problem-item-left {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      overflow: hidden;
    }

    .problem-item-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .problem-item-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge-diff {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    .diff-easy { color: #34d399; }
    .diff-medium { color: #fbbf24; }
    .diff-hard { color: #fb7185; }

    .problem-item-check {
      font-size: 0.85rem;
      color: #10b981;
    }

    /* Middle Pane: Problem Details & Mendix Parallel */
    .problem-pane {
      flex: 1;
      border-right: 1px solid var(--card-border);
      background: #0d1322;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .problem-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }

    .problem-title h2 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .problem-meta-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.35rem;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tag-easy { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .tag-medium { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-hard { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    .tag-phase {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }

    .tag-xp {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-amber);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Mendix Parallel Box */
    .mendix-box {
      background: linear-gradient(180deg, rgba(30, 27, 75, 0.6) 0%, rgba(17, 24, 39, 0.8) 100%);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 12px;
      padding: 1rem 1.25rem;
    }

    .mendix-box h4 {
      font-size: 0.8rem;
      color: #a5b4fc;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .mendix-box p {
      font-size: 0.825rem;
      color: #c7d2fe;
      line-height: 1.5;
    }

    .spec-section h3 {
      font-size: 0.775rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .spec-section p {
      font-size: 0.875rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .example-code {
      background: #080d18;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #94a3b8;
      white-space: pre-wrap;
    }

    /* Hint and Solution Accordions */
    .collapsible-box {
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      background: #080d18;
    }

    .collapsible-header {
      padding: 0.6rem 0.85rem;
      font-size: 0.775rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
    }
    .collapsible-header:hover { color: #fff; }

    .collapsible-content {
      padding: 0.75rem 0.85rem;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.5;
      display: none;
      border-top: 1px solid var(--card-border);
    }
    .collapsible-content.open { display: block; }

    /* Right Pane: Code Editor & Test Console */
    .editor-pane {
      width: 48%;
      background: var(--editor-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .editor-toolbar {
      padding: 0.5rem 1rem;
      background: #080d1a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-tab {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.775rem;
      font-weight: 700;
      color: var(--accent-sky);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-reset {
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .btn-reset:hover { background: #334155; color: #fff; }

    .btn-solution {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-amber);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-solution:hover { background: var(--accent-amber); color: #090d16; }

    .btn-run {
      background: #10b981;
      color: #090d16;
      font-size: 0.775rem;
      font-weight: 800;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .btn-run:hover { background: #34d399; }

    .editor-body {
      flex: 1;
      position: relative;
    }

    textarea#codeEditor {
      width: 100%;
      height: 100%;
      background: transparent;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 1rem;
      border: none;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    /* Bottom Test Console */
    .test-console {
      height: 38%;
      background: #080d1a;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
    }

    .test-header {
      padding: 0.5rem 1rem;
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .test-list {
      padding: 0.75rem 1rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.775rem;
    }

    .test-item {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-passed { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .test-failed { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #090d16;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.825rem;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
    }

    @media (max-width: 1024px) {
      .catalog-sidebar { width: 220px; }
      .editor-pane { width: 50%; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">⚔️</div>
      <div class="brand-title">
        <h1>Full-Stack Code Arena</h1>
        <p>Complete 90-Day Enterprise Roadmap • 24 Hands-On Challenges</p>
      </div>
    </div>

    <div class="header-stats">
      <div class="stat-pill">
        <span>🏆 Solved:</span>
        <strong id="solvedBadge" style="color: var(--accent-emerald);">0 / 24</strong>
      </div>
      <div class="stat-pill">
        <span>⚡ Total XP:</span>
        <strong id="xpBadge" style="color: var(--accent-amber);">0 XP</strong>
      </div>
      <button class="btn-action" onclick="shareChallenge()">🔗 Share Challenge</button>
      <a href="index.html" class="btn-action" style="background: rgba(255,255,255,0.06); color: #cbd5e1; border-color: var(--card-border);">📊 Analytics Hub</a>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="arena-container">
    
    <!-- Left: 24-Topic Curriculum Drawer -->
    <div class="catalog-sidebar">
      <div class="sidebar-header">
        <span style="font-size: 0.725rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Curriculum Filter:</span>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setPhaseFilter('all', this)">All (24)</button>
          <button class="filter-tab" onclick="setPhaseFilter('Phase 1', this)">Phase 1</button>
          <button class="filter-tab" onclick="setPhaseFilter('Phase 2', this)">Phase 2</button>
          <button class="filter-tab" onclick="setPhaseFilter('Phase 3', this)">Phase 3</button>
        </div>
      </div>

      <div class="problem-list" id="problemList">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Middle: Problem Specification & Mendix Rosetta Stone -->
    <div class="problem-pane" id="problemPane">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Right: Code Editor & Test Runner -->
    <div class="editor-pane">
      <div class="editor-toolbar">
        <div class="editor-tab">
          <span>⚡ solution.ts</span>
        </div>
        <div class="editor-actions">
          <button class="btn-solution" onclick="revealSolution()">💡 View Solution</button>
          <button class="btn-reset" onclick="resetCurrentCode()">↺ Reset</button>
          <button class="btn-run" onclick="runTests()">▶ Run Tests</button>
        </div>
      </div>

      <div class="editor-body">
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>

      <div class="test-console">
        <div class="test-header">
          <span>Test Suite Verification</span>
          <span id="testSummary" style="color: var(--text-muted);">Ready to run</span>
        </div>
        <div class="test-list" id="testList">
          <div style="color: #64748b; font-style: italic; text-align: center; margin-top: 2rem;">
            Click ▶ Run Tests to execute test cases against your code.
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script>
    const CHALLENGES = [
  {
    "id": "p1",
    "week": "Week 1",
    "phase": "Phase 1: React 18 Core",
    "title": "The Closure-Safe Counter",
    "category": "Lexical Scope & Closures",
    "difficulty": "Easy",
    "xp": 100,
    "mendixParallel": "In a Mendix microflow loop, reusing a stale local variable instead of reading the updated object state causes silent data corruption. In React, functional updates `setVal(prev => prev + 1)` and private lexical scope guarantee closure safety across renders.",
    "description": "Implement `createCounter(initialValue)`. It must return an object with three methods: `increment()`, `decrement()`, and `getValue()`. Internal state must remain encapsulated within lexical scope and cannot be directly mutated from outside.",
    "example": "const c = createCounter(10);\nc.increment(); // 11\nc.increment(); // 12\nc.decrement(); // 11\nc.getValue();  // 11",
    "hints": [
      "Keep a local variable `let count = initialValue` inside the outer function body.",
      "Return an object whose methods close over `count` and modify it with `++count` or `--count`."
    ],
    "starterCode": "function createCounter(initialValue = 0) {\n  let count = initialValue;\n\n  return {\n    increment: () => {\n      // TODO: Increment and return updated count\n      return ++count;\n    },\n    decrement: () => {\n      // TODO: Decrement and return updated count\n      return --count;\n    },\n    getValue: () => {\n      // TODO: Return current count\n      return count;\n    }\n  };\n}",
    "solution": "function createCounter(initialValue = 0) {\n  let count = initialValue;\n  return {\n    increment: () => ++count,\n    decrement: () => --count,\n    getValue: () => count\n  };\n}",
    "tests": [
      {
        "name": "Initializes with custom starting value",
        "testFnStr": "const c = fn(100); return c.getValue() === 100;"
      },
      {
        "name": "Performs consecutive increments and decrements",
        "testFnStr": "const c = fn(5); c.increment(); c.increment(); c.decrement(); return c.getValue() === 6;"
      },
      {
        "name": "Encapsulates state across independent instances",
        "testFnStr": "const a = fn(10); const b = fn(20); a.increment(); return a.getValue() === 11 && b.getValue() === 20;"
      }
    ]
  },
  {
    "id": "p2",
    "week": "Week 1",
    "phase": "Phase 1: React 18 Core",
    "title": "Debounce Function Executor",
    "category": "Event Loop & Asynchronous Timers",
    "difficulty": "Medium",
    "xp": 150,
    "mendixParallel": "Calling an On-Change microflow on every single keystroke creates massive server load. Debouncing delays execution until the user pauses typing for `delay` milliseconds, cutting network calls by 95%.",
    "description": "Write `debounce(fn, delay)`. The returned function delays invoking `fn` until after `delay` milliseconds have elapsed since the last call. If invoked again before the delay expires, previous timers are cancelled.",
    "example": "const log = debounce(console.log, 100);\nlog('a');\nlog('b');\n// Only 'b' executes after 100ms",
    "hints": [
      "Maintain a `timerId` variable in the outer closure.",
      "Clear any active timer with `clearTimeout(timerId)` whenever called again."
    ],
    "starterCode": "function debounce(fn, delay) {\n  let timerId = null;\n\n  return function(...args) {\n    // TODO: Clear existing timer if active\n    if (timerId) clearTimeout(timerId);\n\n    // TODO: Set new timer to execute fn with args after delay\n    timerId = setTimeout(() => {\n      fn.apply(this, args);\n    }, delay);\n  };\n}",
    "solution": "function debounce(fn, delay) {\n  let timerId = null;\n  return function(...args) {\n    if (timerId) clearTimeout(timerId);\n    timerId = setTimeout(() => {\n      fn.apply(this, args);\n    }, delay);\n  };\n}",
    "tests": [
      {
        "name": "Cancels intermediate calls and fires once after delay",
        "testFnStr": "return new Promise((resolve) => {\n          let count = 0;\n          let lastArg = '';\n          const debounced = fn((val) => { count++; lastArg = val; }, 50);\n          debounced('first');\n          debounced('second');\n          debounced('third');\n          setTimeout(() => {\n            resolve(count === 1 && lastArg === 'third');\n          }, 100);\n        });"
      },
      {
        "name": "Allows new invocation after delay window elapses",
        "testFnStr": "return new Promise((resolve) => {\n          let calls = 0;\n          const debounced = fn(() => { calls++; }, 40);\n          debounced();\n          setTimeout(() => {\n            debounced();\n            setTimeout(() => {\n              resolve(calls === 2);\n            }, 60);\n          }, 70);\n        });"
      }
    ]
  },
  {
    "id": "p3",
    "week": "Week 2",
    "phase": "Phase 1: React 18 Core",
    "title": "Type-Safe Form Reducer",
    "category": "Discriminated Unions & State Machines",
    "difficulty": "Medium",
    "xp": 150,
    "mendixParallel": "In Mendix, you represent workflow progress using an Enumeration (`Draft`, `Submitted`, `Approved`, `Rejected`). In TypeScript/React, Discriminated Unions eliminate impossible intermediate states (e.g. `loading=true` and `error=true` at the same time).",
    "description": "Implement `formReducer(state, action)`. State has `{ status: 'idle' | 'submitting' | 'success' | 'error', data?: any, error?: string }`. Handle action types: `SUBMIT`, `SUCCESS` (payload in `action.payload`), `FAIL` (message in `action.error`), and `RESET`.",
    "example": "formReducer({ status: 'idle' }, { type: 'SUBMIT' });\n// { status: 'submitting' }\nformReducer({ status: 'submitting' }, { type: 'SUCCESS', payload: { id: 1 } });\n// { status: 'success', data: { id: 1 } }",
    "hints": [
      "Use a `switch(action.type)` statement to handle all union cases.",
      "Always return a fresh state object without mutating previous state."

    let currentId = "p1";
    let activeFilter = "all";
    const userCodes = JSON.parse(localStorage.getItem('arena_codes') || '{}');
    const solvedSet = new Set(JSON.parse(localStorage.getItem('arena_solved') || '[]'));

    // Sound Synthesizer via Web Audio API
    function playChime(success) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (success) {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function init() {
      // Check URL hash for direct deep linking
      const hash = window.location.hash.replace('#', '');
      if (hash && CHALLENGES.some(c => c.id === hash)) {
        currentId = hash;
      }
      renderSidebar();
      loadProblem(currentId);
      updateHeaderStats();
    }

    function setPhaseFilter(filter, el) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderSidebar();
    }

    function renderSidebar() {
      const listEl = document.getElementById('problemList');
      listEl.innerHTML = '';

      const filtered = CHALLENGES.filter(c => {
        if (activeFilter === 'all') return true;
        return c.phase.startsWith(activeFilter);
      });

      filtered.forEach((ch, idx) => {
        const item = document.createElement('div');
        item.className = 'problem-item' + (ch.id === currentId ? ' active' : '');
        item.onclick = () => loadProblem(ch.id);

        const diffClass = ch.difficulty === 'Easy' ? 'diff-easy' : ch.difficulty === 'Medium' ? 'diff-medium' : 'diff-hard';
        const isSolved = solvedSet.has(ch.id);

        item.innerHTML = `
          <div class="problem-item-left">
            <div class="problem-item-title">${ch.id.toUpperCase()}. ${ch.title}</div>
            <div class="problem-item-meta">
              <span class="badge-diff ${diffClass}">${ch.difficulty}</span>
              <span>•</span>
              <span>${ch.week}</span>
            </div>
          </div>
          ${isSolved ? '<div class="problem-item-check">✓</div>' : ''}
        `;
        listEl.appendChild(item);
      });
    }

    function loadProblem(id) {
      currentId = id;
      window.location.hash = id;
      const ch = CHALLENGES.find(c => c.id === id);
      if (!ch) return;

      renderSidebar();

      // Render problem details
      const pane = document.getElementById('problemPane');
      const tagDiff = ch.difficulty === 'Easy' ? 'tag-easy' : ch.difficulty === 'Medium' ? 'tag-medium' : 'tag-hard';

      pane.innerHTML = `
        <div class="problem-hero">
          <div>
            <div class="problem-meta-strip">
              <span class="tag ${tagDiff}">${ch.difficulty}</span>
              <span class="tag tag-phase">${ch.phase}</span>
              <span class="tag tag-xp">+${ch.xp} XP</span>
            </div>
            <h2 style="margin-top: 0.5rem;">${ch.id.toUpperCase()}: ${ch.title}</h2>
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;">Topic: ${ch.category} (${ch.week})</div>
          </div>
        </div>

        <div class="mendix-box">
          <h4>🏛️ Mendix Rosetta Stone Parallel</h4>
          <p>${ch.mendixParallel}</p>
        </div>

        <div class="spec-section">
          <h3>Problem Specification</h3>
          <p>${ch.description}</p>
        </div>

        <div class="spec-section">
          <h3>Example Usage</h3>
          <pre class="example-code"><code>${ch.example}</code></pre>
        </div>

        <div class="spec-section">
          <h3>Progressive Hints</h3>
          <div class="collapsible-box">
            <div class="collapsible-header" onclick="toggleAccordion('hint1')">
              <span>💡 Hint 1: Core Strategy</span>
              <span>▼</span>
            </div>
            <div id="hint1" class="collapsible-content">${ch.hints[0]}</div>
          </div>
          <div class="collapsible-box" style="margin-top: 0.5rem;">
            <div class="collapsible-header" onclick="toggleAccordion('hint2')">
              <span>💡 Hint 2: Implementation Detail</span>
              <span>▼</span>
            </div>
            <div id="hint2" class="collapsible-content">${ch.hints[1]}</div>
          </div>
        </div>
      `;

      // Load code into editor (user code or starter code)
      const editor = document.getElementById('codeEditor');
      editor.value = userCodes[id] || ch.starterCode;

      // Reset test list
      document.getElementById('testSummary').textContent = 'Ready to run';
      document.getElementById('testList').innerHTML = `
        <div style="color: #64748b; font-style: italic; text-align: center; margin-top: 2rem;">
          Click ▶ Run Tests to execute test cases against your code.
        </div>
      `;
    }

    function toggleAccordion(id) {
      const el = document.getElementById(id);
      el.classList.toggle('open');
    }

    function resetCurrentCode() {
      const ch = CHALLENGES.find(c => c.id === currentId);
      if (confirm('Reset code to initial template?')) {
        document.getElementById('codeEditor').value = ch.starterCode;
        delete userCodes[currentId];
        localStorage.setItem('arena_codes', JSON.stringify(userCodes));
      }
    }

    function revealSolution() {
      const ch = CHALLENGES.find(c => c.id === currentId);
      if (confirm('Reveal clean reference solution for ' + ch.title + '?')) {
        document.getElementById('codeEditor').value = ch.solution;
        userCodes[currentId] = ch.solution;
        localStorage.setItem('arena_codes', JSON.stringify(userCodes));
      }
    }

    async function runTests() {
      const ch = CHALLENGES.find(c => c.id === currentId);
      const code = document.getElementById('codeEditor').value;
      userCodes[currentId] = code;
      localStorage.setItem('arena_codes', JSON.stringify(userCodes));

      const listEl = document.getElementById('testList');
      const summaryEl = document.getElementById('testSummary');
      listEl.innerHTML = '';
      summaryEl.textContent = 'Running test suite...';

      let passedCount = 0;

      // Extract user function
      let userFn;
      try {
        userFn = new Function('return (' + code + ')')();
      } catch (err) {
        summaryEl.textContent = 'Syntax Error';
        summaryEl.style.color = '#fb7185';
        listEl.innerHTML = `<div class="test-item test-failed">Syntax Error: ${err.message}</div>`;
        playChime(false);
        return;
      }

      for (let i = 0; i < ch.tests.length; i++) {
        const testCase = ch.tests[i];
        const start = performance.now();
        let pass = false;
        let errMsg = '';

        try {
          const testRunner = new Function('fn', testCase.testFnStr);
          const result = testRunner(userFn);
          if (result instanceof Promise) {
            pass = await result;
          } else {
            pass = Boolean(result);
          }
        } catch (e) {
          pass = false;
          errMsg = ' (' + e.message + ')';
        }

        const elapsed = (performance.now() - start).toFixed(1);

        const item = document.createElement('div');
        if (pass) {
          passedCount++;
          item.className = 'test-item test-passed';
          item.innerHTML = `<span>✓ Test ${i+1}: ${testCase.name}</span><span>${elapsed}ms</span>`;
        } else {
          item.className = 'test-item test-failed';
          item.innerHTML = `<span>✗ Test ${i+1}: ${testCase.name}${errMsg}</span><span>FAIL</span>`;
        }
        listEl.appendChild(item);
      }

      const total = ch.tests.length;
      if (passedCount === total) {
        summaryEl.textContent = `All ${total} Tests Passed! (+${ch.xp} XP)`;
        summaryEl.style.color = '#34d399';
        playChime(true);
        confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });

        if (!solvedSet.has(ch.id)) {
          solvedSet.add(ch.id);
          localStorage.setItem('arena_solved', JSON.stringify([...solvedSet]));
          updateHeaderStats();
          renderSidebar();
        }
      } else {
        summaryEl.textContent = `${passedCount} / ${total} Tests Passed`;
        summaryEl.style.color = '#fb7185';
        playChime(false);
      }
    }

    function updateHeaderStats() {
      const solved = solvedSet.size;
      const total = CHALLENGES.length;
      document.getElementById('solvedBadge').textContent = `${solved} / ${total}`;

      let totalXP = 0;
      solvedSet.forEach(id => {
        const ch = CHALLENGES.find(c => c.id === id);
        if (ch) totalXP += ch.xp;
      });
      document.getElementById('xpBadge').textContent = `${totalXP} XP`;
    }

    function shareChallenge() {
      const url = window.location.origin + window.location.pathname + '#' + currentId;
      navigator.clipboard.writeText(url).then(() => {
        showToast('📋 Challenge link copied to clipboard!');
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    // Support Tab key in editor
    document.addEventListener('DOMContentLoaded', () => {
      init();
      const editor = document.getElementById('codeEditor');
      editor.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = start + 2;
        }
      });
    });
  </script>
